<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Aggora · el pipeline de Kafka explicado</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Panel de solo lectura que explica, en lenguaje llano, que esta haciendo el pipeline de Kafka de Aggora: la misma implementacion en Spring Boot y en Quarkus.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    /*
     * Red de seguridad de arranque.
     *
     * Si Angular no llega a pintar, sin esto la pagina se queda en negro y no dice nada, que es lo
     * peor posible para diagnosticar. Aqui se deja constancia en el DOM, que se puede leer abriendo
     * la pagina o desde `npm run diag:browser`.
     */
    (function () {
      function avisar(motivo) {
        try {
          var pre = document.getElementById('boot-errors');
          if (!pre) {
            pre = document.createElement('pre');
            pre.id = 'boot-errors';
            pre.style.cssText =
              'margin:16px;padding:12px;border:1px solid #7f1d1d;border-radius:8px;' +
              'background:#1b1114;color:#ffb4c0;font:12px/1.5 monospace;white-space:pre-wrap;';
            (document.body || document.documentElement).appendChild(pre);
          }
          pre.textContent = 'La pagina no arranco:\n' + motivo;
        } catch (e) {
          /* si ni esto funciona, no hay nada que hacer */
        }
      }
      window.addEventListener(
        'error',
        function (evento) {
          var objetivo = evento.target;
          if (objetivo && objetivo !== window && objetivo.tagName) {
            avisar('no se pudo cargar ' + objetivo.tagName.toLowerCase() + ': ' + (objetivo.src || '?'));
            return;
          }
          avisar((evento.message || 'error') + ' @ ' + (evento.filename || '?') + ':' + (evento.lineno || 0));
        },
        true,
      );
      window.addEventListener('unhandledrejection', function (evento) {
        var razon = evento.reason;
        avisar('promesa rechazada: ' + (razon && razon.message ? razon.message : String(razon)));
      });
      // Si a los 15 s no hay nada pintado, se dice: mejor un aviso que una pantalla negra.
      setTimeout(function () {
        var raiz = document.querySelector('aggora-root');
        if (raiz && raiz.children.length === 0 && !document.getElementById('boot-errors')) {
          avisar('Angular no pinto nada en 15 s y no lanzo ninguna excepcion');
        }
      }, 15000);
    })();
  </script>
</head>
<body>
  <aggora-root></aggora-root>
</body>
</html>
